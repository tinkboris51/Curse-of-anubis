<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curse of Anubis</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
min-height:100vh;
background:radial-gradient(circle at top,#4b3014,#160e07 45%,#050403);
color:#fff1c4;
font-family:Arial,sans-serif;
padding:10px;
}
.game{max-width:850px;margin:auto}
h1{
text-align:center;
color:#ffe18a;
font-size:clamp(25px,7vw,48px);
margin:8px 0 2px;
}
.sub{text-align:center;color:#aa9672;font-size:11px;margin-bottom:12px}

.hud{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:5px;
}
.box{
background:#171008;
border:1px solid #725025;
border-radius:10px;
padding:8px;
text-align:center;
}
.box small{display:block;color:#a99878;font-size:9px}
.box b{font-size:18px}

.machine{
margin-top:8px;
padding:8px;
background:#120c07;
border:2px solid #a27632;
border-radius:18px;
}

.reels{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:4px;
background:#050403;
padding:5px;
border-radius:12px;
}

.reel{
height:225px;
overflow:hidden;
border:1px solid #69491f;
border-radius:8px;
background:#181008;
position:relative;
}

.strip{
position:absolute;
left:0;
right:0;
top:0;
}

.symbol{
height:75px;
display:flex;
align-items:center;
justify-content:center;
font-size:42px;
background:linear-gradient(#302012,#160e08);
border-bottom:1px solid #513719;
}

.win{
background:#5c4018;
outline:3px solid #ffe28b;
outline-offset:-4px;
animation:pulse .4s infinite alternate;
}

@keyframes pulse{
to{transform:scale(1.05);filter:brightness(1.4)}
}

.controls{
display:grid;
grid-template-columns:1fr 1fr 1.5fr 1fr 1fr;
gap:5px;
margin-top:8px;
}

button{
min-height:46px;
border:1px solid #795529;
border-radius:10px;
background:#20150b;
color:#fff0c7;
font-weight:bold;
}

.spin{
background:linear-gradient(#f1c768,#95642a);
color:#201306;
font-size:18px;
}

.active{outline:2px solid #ffe28b}

.message{
margin-top:8px;
padding:10px;
min-height:45px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:#0e0906;
border:1px solid #49331c;
border-radius:10px;
font-weight:bold;
}

.features{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:5px;
margin-top:7px;
}

.features div{
background:#15100a;
border:1px solid #3f2c18;
border-radius:8px;
padding:7px;
text-align:center;
font-size:10px;
color:#aa9672;
}

.features b{color:#f3d27d}

.demo{
text-align:center;
font-size:10px;
color:#70634e;
margin-top:10px;
}

.overlay{
position:fixed;
inset:0;
background:#000d;
display:none;
align-items:center;
justify-content:center;
z-index:20;
padding:15px;
}

.overlay.show{display:flex}

.card{
width:min(450px,95vw);
background:linear-gradient(#302112,#100b07);
border:2px solid #a97b37;
border-radius:17px;
padding:20px;
text-align:center;
}

.card h2{
font-size:32px;
color:#ffe18a;
margin:0 0 10px;
}

.chests{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.chests button{
font-size:40px;
min-height:90px;
}

@media(max-width:600px){
.hud{grid-template-columns:repeat(2,1fr)}
.hud .box:last-child{grid-column:span 2}
.reel{height:180px}
.symbol{height:60px;font-size:34px}
.controls{grid-template-columns:1fr 1fr 1.4fr}
.features{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<div class="game">

<h1>𓂀 CURSE OF ANUBIS 𓂀</h1>
<div class="sub">DELUXE DEMO • TUMBLE • FREE SPINS • BONUS</div>

<div class="hud">
<div class="box"><small>KREDIT</small><b id="credit">1000</b></div>
<div class="box"><small>STÁVKA</small><b id="bet">10</b></div>
<div class="box"><small>VÝHRA</small><b id="win">0</b></div>
<div class="box"><small>FREE SPINS</small><b id="free">0</b></div>
<div class="box"><small>NÁSOBIČ</small><b id="multi">×1</b></div>
</div>

<div class="machine">

<div class="reels" id="reels"></div>

<div class="controls">
<button id="minus">− BET</button>
<button id="turbo">⚡ TURBO</button>
<button class="spin" id="spin">SPIN</button>
<button id="auto">AUTO ×10</button>
<button id="plus">+ BET</button>
</div>

<div class="message" id="message">
𓂀 Stlač SPIN
</div>

<div class="features">
<div><b>🐕 WILD</b><br>Nahrádza symboly</div>
<div><b>🪲 SCATTER</b><br>3+ = Free Spins</div>
<div><b>☥ BONUS</b><br>3+ = Bonus hra</div>
<div><b>🔥 TUMBLE</b><br>Výherné symboly miznú</div>
</div>

</div>

<div class="demo">
DEMO • Fiktívne kredity • Bez reálnych peňazí
</div>

</div>

<div class="overlay" id="overlay">
<div class="card" id="card"></div>
</div>

<script>

const symbols=["🦂","🐍","🏺","👁️","💎","👑","🐕","🪲","☥"];
const weights=[24,22,18,14,10,6,3,2,1];

const bets=[5,10,20,50,100];

let credit=1000;
let betIndex=1;
let freeSpins=0;
let multiplier=1;
let turbo=false;
let busy=false;
let auto=0;
let board=[];

const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function pick(){

let total=weights.reduce((a,b)=>a+b,0);
let r=Math.random()*total;

for(let i=0;i<symbols.length;i++){
r-=weights[i];
if(r<=0)return symbols[i];
}

return symbols[0];

}

function newBoard(){

return Array.from({length:15},()=>pick());

}

function update(){

$("credit").textContent=Math.floor(credit);
$("bet").textContent=bets[betIndex];
$("free").textContent=freeSpins;
$("multi").textContent="×"+multiplier;

}

function draw(highlight=[]){

$("reels").innerHTML="";

for(let col=0;col<5;col++){

let reel=document.createElement("div");
reel.className="reel";

let strip=document.createElement("div");
strip.className="strip";

for(let row=0;row<3;row++){

let index=row*5+col;

let symbol=document.createElement("div");

symbol.className=
"symbol "+(highlight.includes(index)?"win":"");

symbol.textContent=board[index];

strip.appendChild(symbol);

}

reel.appendChild(strip);
$("reels").appendChild(reel);

}

}

async function animateReels(){

$("reels").innerHTML="";

let strips=[];

let height=window.innerWidth<=600?60:75;

let filler=18;

for(let col=0;col<5;col++){

let reel=document.createElement("div");
reel.className="reel";

let strip=document.createElement("div");
strip.className="strip";

for(let i=0;i<filler;i++){

let s=document.createElement("div");
s.className="symbol";
s.textContent=pick();

strip.appendChild(s);

}

for(let row=0;row<3;row++){

let s=document.createElement("div");
s.className="symbol";
s.textContent=board[row*5+col];

strip.appendChild(s);

}

reel.appendChild(strip);
$("reels").appendChild(reel);

strips.push(strip);

}

await sleep(30);

let base=turbo?260:700;
let step=turbo?50:130;

strips.forEach((strip,i)=>{

strip.style.transition=
`transform ${base+i*step}ms cubic-bezier(.08,.75,.15,1.03)`;

strip.style.transform=
`translateY(${-filler*height}px)`;

});

await sleep(base+step*4+100);

}

function count(symbol){

return board.filter(x=>x===symbol).length;

}

function evaluate(){

let map={};
let wild=[];

board.forEach((s,i)=>{

if(s==="🐕")wild.push(i);

else if(s!=="🪲" && s!=="☥"){

if(!map[s])map[s]=[];

map[s].push(i);

}

});

let values={
"🦂":2,
"🐍":2,
"🏺":3,
"👁️":4,
"💎":5,
"👑":8
};

let wins=[];

Object.keys(map).forEach(symbol=>{

let ids=[...map[symbol],...wild];

if(ids.length>=8){

wins.push({
ids,
pay:values[symbol]||2
});

}

});

return wins;

}

async function tumble(bet){

let total=0;
let round=0;

while(round<5){

let wins=evaluate();

if(!wins.length)break;

round++;

let ids=[];

wins.forEach(w=>{
w.ids.forEach(i=>{
if(!ids.includes(i))ids.push(i);
});
});

let amount=0;

wins.forEach(w=>{
amount+=bet*w.pay*multiplier;
});

amount=Math.floor(amount);

total+=amount;

draw(ids);

$("message").textContent=
`🔥 TUMBLE ${round} • ×${multiplier} • +${amount}`;

await sleep(turbo?180:500);

ids.forEach(i=>board[i]=null);

draw();

await sleep(turbo?80:180);

board=board.map(x=>x===null?pick():x);

multiplier=Math.min(10,multiplier+1);

update();
draw();

await sleep(turbo?100:250);

}

return total;

}

function show(html){

$("card").innerHTML=html;
$("overlay").classList.add("show");

}

function hide(){

$("overlay").classList.remove("show");

}

async function bonusGame(bet){

return new Promise(resolve=>{

show(`
<h2>𓂀 BONUS 𓂀</h2>
<p>Vyber jednu egyptskú truhlicu.</p>

<div class="chests">
<button>🏺</button>
<button>🏺</button>
<button>🏺</button>
</div>
`);

document
.querySelectorAll(".chests button")
.forEach(btn=>{

btn.onclick=()=>{

let multipliers=[10,15,20,30,50];

let value=
multipliers[
Math.floor(Math.random()*multipliers.length)
]*bet;

btn.textContent="💰";

setTimeout(()=>{

hide();
resolve(value);

},500);

};

});

});

}

async function addWin(value){

if(value<=0)return;

let start=credit;
let begin=Date.now();

let duration=turbo?200:650;

return new Promise(resolve=>{

function frame(){

let p=
Math.min(1,(Date.now()-begin)/duration);

let displayed=
Math.floor(value*(1-Math.pow(1-p,3)));

$("win").textContent=displayed;

$("credit").textContent=
Math.floor(start+displayed);

if(p<1){

requestAnimationFrame(frame);

}else{

credit+=value;

update();

resolve();

}

}

frame();

});

}

async function spin(){

if(busy)return;

let bet=bets[betIndex];

let free=freeSpins>0;

if(!free && credit<bet){

$("message").textContent=
"Nemáš dostatok kreditov.";

return;

}

busy=true;

$("spin").disabled=true;
$("win").textContent="0";

if(free){

freeSpins--;

}else{

credit-=bet;
multiplier=1;

}

update();

$("message").textContent=
free?"🎁 FREE SPIN…":"𓂀 Valce sa točia…";

board=newBoard();

await animateReels();

draw();

let scatter=count("🪲");
let bonus=count("☥");

let total=await tumble(bet);

if(scatter>=3){

let award=
scatter>=5?15:
scatter===4?10:8;

freeSpins+=award;

multiplier=Math.max(2,multiplier);

update();

show(`
<h2>🪲 ${award} FREE SPINS 🪲</h2>
<p>Anubis odomkol Free Spins!</p>
<button id="continue">POKRAČOVAŤ</button>
`);

setTimeout(()=>{

$("continue").onclick=hide;

},0);

}

if(bonus>=3){

let bonusWin=
await bonusGame(bet);

total+=bonusWin;

$("message").textContent=
"🏺 BONUS +"+bonusWin;

}

if(total>0){

await addWin(total);

if(total>=bet*20){

show(`
<h2>🔥 MEGA WIN 🔥</h2>
<p style="font-size:30px">
${total} kreditov
</p>
<button id="mega">POKRAČOVAŤ</button>
`);

setTimeout(()=>{

$("mega").onclick=hide;

},0);

}

}else if(scatter<3 && bonus<3){

$("message").textContent="Bez výhry.";

}

update();

busy=false;

$("spin").disabled=false;

if(freeSpins>0){

setTimeout(spin,turbo?200:600);

}else if(auto>0){

auto--;

if(auto>0){

setTimeout(spin,turbo?180:400);

}

}

}

$("spin").onclick=spin;

$("minus").onclick=()=>{

if(!busy && betIndex>0){

betIndex--;
update();

}

};

$("plus").onclick=()=>{

if(!busy && betIndex<bets.length-1){

betIndex++;
update();

}

};

$("turbo").onclick=()=>{

turbo=!turbo;

$("turbo").classList.toggle(
"active",
turbo
);

$("turbo").textContent=
turbo?"⚡ TURBO ON":"⚡ TURBO";

};

$("auto").onclick=()=>{

if(busy)return;

auto=10;

spin();

};

board=newBoard();

draw();

update();

</script>

</body>
</html>
