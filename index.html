<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02060c">
<title>Curse of Anubis V5</title>

<style>
:root{
  --gold:#f4ca65;
  --gold2:#9b651c;
  --blue:#159cff;
  --deep:#02060c;
  --panel:#071422;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#02050a;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
  overflow-x:hidden;
}

body{
  background:
    radial-gradient(circle at 50% -10%,#224b78 0,#0a1a2c 30%,#02060c 64%,#000 100%);
}

/* =========================
   BACKGROUND
========================= */

.world{
  min-height:100vh;
  position:relative;
  overflow:hidden;
}

.stars{
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.6;
  background-image:
    radial-gradient(circle,#fff 1px,transparent 1.5px),
    radial-gradient(circle,#7fc7ff 1px,transparent 1.5px),
    radial-gradient(circle,#ffd86a 1px,transparent 1.5px);
  background-size:71px 71px,111px 111px,151px 151px;
  background-position:0 0,31px 20px,80px 55px;
}

.moon{
  position:fixed;
  width:190px;
  height:190px;
  border-radius:50%;
  top:40px;
  left:50%;
  transform:translateX(-50%);
  background:
    radial-gradient(circle at 40% 35%,#fff,#d7eaff 48%,#7ca4c3 70%,#21374f);
  box-shadow:
    0 0 35px #d9f0ff,
    0 0 100px #65baff66;
  opacity:.76;
}

.pyramid{
  position:fixed;
  bottom:0;
  width:0;
  height:0;
  opacity:.45;
  pointer-events:none;
}

.p1{
  left:-70px;
  border-left:240px solid transparent;
  border-right:240px solid transparent;
  border-bottom:390px solid #0b1722;
}

.p2{
  right:-100px;
  border-left:280px solid transparent;
  border-right:280px solid transparent;
  border-bottom:450px solid #08131e;
}

.haze{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:40vh;
  background:linear-gradient(transparent,#000a);
  pointer-events:none;
}

/* =========================
   MAIN APP
========================= */

.app{
  position:relative;
  z-index:10;
  width:min(1050px,100%);
  margin:auto;
  padding:8px;
}

/* =========================
   LOGO
========================= */

.logo{
  text-align:center;
  position:relative;
  padding:7px 0 8px;
}

.logo .small{
  font-family:Georgia,serif;
  font-size:11px;
  letter-spacing:.48em;
  color:#d9a63c;
}

.logo .big{
  font-family:Georgia,serif;
  font-weight:900;
  font-size:clamp(45px,8vw,86px);
  line-height:.85;
  background:
    linear-gradient(
      #fff6ba 0%,
      #f7d269 25%,
      #ba721f 55%,
      #663006 73%,
      #ffd970 100%
    );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;

  filter:
    drop-shadow(0 4px 0 #311600)
    drop-shadow(0 0 16px #ffbd3450);
}

.logo:after{
  content:"𓂀";
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:-14px;
  color:#48baff;
  font-size:25px;
  text-shadow:0 0 12px #39a8ff;
}

/* =========================
   JACKPOTS
========================= */

.jackpots{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-bottom:6px;
}

.jackpot{
  background:
    linear-gradient(180deg,#102944f4,#050c14fa);
  border:1px solid #a16c25;
  border-radius:10px;
  padding:6px 3px;
  text-align:center;
  box-shadow:
    inset 0 0 0 1px #2d1b07,
    0 5px 15px #0009;
}

.jackpot small{
  display:block;
  color:#dba94b;
  letter-spacing:.12em;
  font-size:8px;
}

.jackpot b{
  color:#ffe783;
  font-family:Georgia,serif;
  font-size:15px;
}

/* =========================
   INFO BAR
========================= */

.info-bar{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin-bottom:6px;
}

.info-box{
  background:linear-gradient(#0c2138,#040b13);
  border:1px solid #72501e;
  border-radius:9px;
  text-align:center;
  padding:5px;
}

.info-box small{
  display:block;
  font-size:8px;
  color:#c89d43;
}

.info-box strong{
  display:block;
  font-size:18px;
  color:#ffe790;
}

/* =========================
   TEMPLE FRAME
========================= */

.temple{
  position:relative;
  padding:13px 12px 12px;

  background:
    linear-gradient(
      90deg,
      #261300,
      #a56a18 3%,
      #e8b853 6%,
      #6a3c0a 10%,
      #130a02 14%,
      #130a02 86%,
      #6a3c0a 90%,
      #e8b853 94%,
      #a56a18 97%,
      #261300
    );

  border-radius:22px;

  box-shadow:
    0 17px 38px #000,
    0 0 30px #daa02f2e,
    inset 0 0 0 2px #382008;
}

.temple:before,
.temple:after{
  position:absolute;
  top:20%;
  font-size:70px;
  opacity:.25;
  color:#d69c36;
  text-shadow:0 0 20px #ffb72d;
}

.temple:before{
  content:"𓁢";
  left:-37px;
}

.temple:after{
  content:"𓁢";
  right:-37px;
  transform:scaleX(-1);
}

/* =========================
   TORCH
========================= */

.torch{
  position:absolute;
  width:15px;
  height:45px;
  background:#5a3510;
  z-index:15;
  top:18px;
}

.torch.left{
  left:-17px;
}

.torch.right{
  right:-17px;
}

.flame{
  position:absolute;
  width:25px;
  height:36px;
  left:-5px;
  top:-29px;

  border-radius:
    50% 50% 45% 45%;

  background:
    radial-gradient(
      ellipse at 50% 75%,
      #fff5a5,
      #ffca33 25%,
      #ff6a00 55%,
      transparent 72%
    );

  filter:
    drop-shadow(0 0 9px #ff8c00)
    drop-shadow(0 0 20px #ff3c00);

  animation:fire .14s infinite alternate;
}

@keyframes fire{
  from{
    transform:scale(.92,1) rotate(-2deg);
  }
  to{
    transform:scale(1.08,.93) rotate(3deg);
  }
}

/* =========================
   REELS
========================= */

.reels{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px;

  background:#000;

  border:
    3px solid #5d3c0d;

  padding:5px;

  border-radius:12px;

  box-shadow:
    inset 0 0 30px #000,
    0 0 20px #000;
}

.reel{
  position:relative;
  height:300px;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 45%,
      #153657,
      #06101d 58%,
      #010306
    );
}

.strip{
  position:absolute;
  left:0;
  right:0;
  top:0;
}

.symbol{
  height:100px;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  overflow:hidden;

  border-right:
    1px solid #1c3650;

  border-bottom:
    1px solid #1c3650;

  background:
    radial-gradient(
      circle at 50% 45%,
      #163d62,
      #081625 58%,
      #02060b 100%
    );
}

.symbol:before{
  content:"";

  position:absolute;
  inset:5px;

  border:
    1px solid #d7a64655;

  border-radius:9px;

  box-shadow:
    inset 0 0 15px #000;
}

/* =========================
   SYMBOL GRAPHICS
========================= */

.art{
  position:relative;
  z-index:2;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  width:92%;
  height:92%;

  filter:
    drop-shadow(0 6px 5px #000);
}

.icon{
  font-family:Georgia,serif;

  font-size:
    clamp(38px,7vw,68px);

  line-height:.85;

  background:
    linear-gradient(
      #fff8c0,
      #f0c75d 35%,
      #bd7727 68%,
      #613308
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  filter:
    drop-shadow(0 2px 0 #000)
    drop-shadow(0 0 9px #e2b44655);
}

.symbol-name{
  margin-top:4px;

  font-size:
    clamp(7px,1.4vw,11px);

  letter-spacing:.08em;

  font-weight:900;

  color:#ffe88c;

  text-shadow:
    0 2px 3px #000;
}

/* WILD */

.type-wild{
  background:
    radial-gradient(circle,#174e78,#06111c 70%);
}

.type-wild .icon{
  background:
    linear-gradient(
      #a9e6ff,
      #3ebaff 30%,
      #eec85c 63%,
      #79410c
    );

  -webkit-background-clip:text;
  background-clip:text;
}

.type-wild .symbol-name{
  color:#6ed4ff;
}

/* SCATTER */

.type-scatter{
  background:
    radial-gradient(circle,#3f5521,#07120c 72%);
}

.type-scatter .icon{
  background:
    linear-gradient(
      #d9ff76,
      #79d73b 38%,
      #e0b23d 65%,
      #664208
    );

  -webkit-background-clip:text;
  background-clip:text;
}

.type-scatter .symbol-name{
  color:#baff76;
}

/* BONUS */

.type-bonus{
  background:
    radial-gradient(circle,#633b12,#160902 72%);
}

.type-bonus .icon{
  background:
    linear-gradient(
      #fff2a2,
      #ffb82e 42%,
      #ed6b15 70%,
      #6d2500
    );

  -webkit-background-clip:text;
  background-clip:text;
}

.type-bonus .symbol-name{
  color:#ffbe45;
}

/* WIN */

.symbol.win{
  z-index:5;

  outline:
    4px solid #ffe665;

  outline-offset:-4px;

  animation:
    winner .32s infinite alternate;

  box-shadow:
    inset 0 0 35px #ffd94e88;
}

@keyframes winner{
  from{
    filter:
      brightness(1);
  }

  to{
    filter:
      brightness(1.65);

    transform:
      scale(1.025);
  }
}

/* =========================
   PAYLINE FLASH
========================= */

.lineflash{
  position:absolute;
  left:15px;
  right:15px;
  height:4px;
  top:50%;
  background:#ffdc57;
  z-index:50;
  box-shadow:
    0 0 7px #fff,
    0 0 18px #ffc400;
  pointer-events:none;
  opacity:0;
}

/* =========================
   CONTROLS
========================= */

.controls{
  display:grid;
  grid-template-columns:
    1fr
    1fr
    94px
    1fr
    1fr;

  gap:6px;

  align-items:center;

  margin-top:7px;
}

.readout,
.control-button{
  min-height:56px;

  border:
    2px solid #80581d;

  border-radius:11px;

  background:
    linear-gradient(
      #15385b,
      #071727
    );

  color:#ffe99b;

  text-align:center;

  box-shadow:
    inset 0 0 13px #000;
}

.readout{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.readout small{
  color:#d2a23b;
  font-size:8px;
  letter-spacing:.12em;
}

.readout strong{
  font-size:20px;
}

.control-button{
  padding:7px;
}

.spin{
  width:94px;
  height:94px;

  border-radius:50%;

  color:#fff5bc;

  font-size:16px;
  font-weight:900;

  border:
    4px solid #f1c758;

  background:
    radial-gradient(
      circle at 35% 27%,
      #84e4ff,
      #25a7ff 27%,
      #0870d2 48%,
      #033f8a 62%,
      #031632 66%,
      #f0be4d 69%,
      #6c450f 78%,
      #04101e 82%
    );

  box-shadow:
    0 0 22px #139fffaa,
    0 0 40px #139fff44,
    inset 0 0 0 4px #744b12;
}

.spin:active{
  transform:scale(.94);
}

.spin:disabled{
  opacity:.55;
}

/* =========================
   QUICK BET
========================= */

.quick{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  margin-top:5px;
}

.quick button{
  min-height:39px;

  border:
    1px solid #85601e;

  border-radius:8px;

  background:
    linear-gradient(
      #153654,
      #071522
    );

  color:#e9bb50;
}

.quick button.active{
  color:#fff3ae;

  outline:
    1px solid #ffe578;

  box-shadow:
    0 0 13px #ffd75999;
}

/* =========================
   STATUS
========================= */

.status{
  margin-top:6px;

  min-height:43px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  border:
    1px solid #6f5121;

  border-radius:10px;

  background:
    linear-gradient(
      #071725,
      #03090f
    );

  color:#dbeeff;

  font-size:12px;

  font-weight:800;

  box-shadow:
    inset 0 0 13px #000;
}

.demo{
  text-align:center;

  margin-top:5px;

  color:#718294;

  font-size:9px;
}

/* =========================
   OVERLAY
========================= */

.overlay{
  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;

  background:
    radial-gradient(circle,#08233be8,#000000f2);

  padding:15px;
}

.overlay.show{
  display:flex;
}

.modal{
  width:min(460px,94vw);

  border:
    2px solid #a97526;

  border-radius:18px;

  background:
    linear-gradient(
      #153654,
      #050b12
    );

  padding:20px;

  text-align:center;

  box-shadow:
    0 0 60px #000;
}

.modal h1{
  margin:0 0 7px;

  font-family:Georgia,serif;

  color:#f3ca64;

  font-size:32px;
}

.modal p{
  color:#d5e5f2;
}

.modal button{
  min-height:44px;

  border:
    1px solid #a77827;

  border-radius:9px;

  background:
    linear-gradient(
      #174571,
      #07192b
    );

  color:#ffd971;

  padding:9px 15px;
}

.chests{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:9px;
}

.chests button{
  min-height:90px;
  font-size:35px;
}

/* =========================
   BIG WIN
========================= */

.big-number{
  font-size:48px;
  color:#ffe269;
  font-weight:900;
  text-shadow:
    0 0 15px #ffb300;
}

/* =========================
   MOBILE
========================= */

@media(max-width:620px){

  .app{
    padding:4px;
  }

  .logo{
    padding-top:5px;
  }

  .logo .big{
    font-size:45px;
  }

  .logo .small{
    font-size:8px;
  }

  .jackpots{
    grid-template-columns:
      repeat(2,1fr);
  }

  .jackpot{
    padding:4px;
  }

  .jackpot b{
    font-size:12px;
  }

  .info-box{
    padding:4px;
  }

  .info-box strong{
    font-size:15px;
  }

  .temple{
    padding:7px 6px 7px;
    border-radius:15px;
  }

  .temple:before,
  .temple:after{
    display:none;
  }

  .torch{
    display:none;
  }

  .reel{
    height:240px;
  }

  .symbol{
    height:80px;
  }

  .icon{
    font-size:46px;
  }

  .controls{
    grid-template-columns:
      1fr
      1fr
      82px;

    grid-template-areas:
      "balance bet spin"
      "win auto spin";
  }

  .balance{
    grid-area:balance;
  }

  .bet{
    grid-area:bet;
  }

  .win{
    grid-area:win;
  }

  .auto{
    grid-area:auto;
  }

  .spin{
    grid-area:spin;

    width:82px;
    height:82px;

    font-size:14px;
  }

  .readout,
  .control-button{
    min-height:48px;
  }

  .readout strong{
    font-size:16px;
  }

  .quick button{
    font-size:9px;
    padding:3px;
  }
}
</style>
</head>

<div class="app">

<div class="logo">

</div>

/* ===========================================

const PAYLINES = [

  [2,2,1,2,2],

  [0,1,2,2,2],

  [2,1,0,0,0],

  [0,1,1,2,2],

  [2,1,1,0,0],

  [1,0,1,2,1],

  [1,2,1,0,1],

  [0,1,2,1,2],

  [2,1,0,1,0]

];


/* ===========================================
   PAYTABLE

   Numbers = multiplier of current bet.
=========================================== */

const PAYTABLE = {

  eye:{
    3:0.22,
    4:0.60,
    5:1.45
  },

  cobra:{
    3:0.28,
    4:0.72,
    5:1.75
  },

  ankh:{
    3:0.34,
    4:0.85,
    5:2.20
  },

  pyramid:{
    3:0.42,
    4:1.10,
    5:2.85
  },

  pharaoh:{
    3:0.60,
    4:1.55,
    5:4.00
  },

  wild:{
    3:0.90,
    4:2.40,
    5:6.50
  }

};


/* ===========================================
   GAME STATE
=========================================== */

let credit = 1000;

let betIndex = 1;

let freeSpins = 0;

let multiplier = 1;

let board = [];

let busy = false;

let turbo = false;

let autoRemaining = 0;


/* ===========================================
   HELPERS
=========================================== */

const $ = id =>
  document.getElementById(id);


const wait = ms =>
  new Promise(resolve =>
    setTimeout(resolve,ms)
  );


function position(column,row){

  return row * 5 + column;

}


function getCell(column,row){

  return board[
    position(column,row)
  ];

}


/* ===========================================
   RANDOM SYMBOL
=========================================== */

function randomSymbol(){

  let total = 0;

  for(const item of SYMBOL_POOL){

    total += item[1];

  }

  let random =
    Math.random() * total;

  for(const item of SYMBOL_POOL){

    random -= item[1];

    if(random <= 0){

      return item[0];

    }

  }

  return "eye";

}


/* ===========================================
   GENERATE BOARD
=========================================== */

function generateBoard(){

  const result = [];

  for(let i = 0;i < 15;i++){

    result.push(
      randomSymbol()
    );

  }

  /*
  Small demo helper.

  Around 18% of paid spins receive
  a guaranteed possible 3-symbol line.

  This avoids absurdly long runs such
  as 50 spins with no win.
  */

  if(Math.random() < 0.18){

    const line =
      PAYLINES[
        Math.floor(
          Math.random() *
          PAYLINES.length
        )
      ];

    const available = [
      "eye",
      "cobra",
      "ankh",
      "pyramid"
    ];

    const symbol =
      available[
        Math.floor(
          Math.random() *
          available.length
        )
      ];

    const length =
      Math.random() < 0.20
      ? 4
      : 3;

    for(
      let column = 0;
      column < length;
      column++
    ){

      const row =
        line[column];

      result[
        position(column,row)
      ] = symbol;

    }

  }

  return result;

}


/* ===========================================
   CREATE SYMBOL
=========================================== */

function createSymbol(
  symbol,
  winner = false
){

  const data =
    SYMBOL_DATA[symbol];

  const cell =
    document.createElement(
      "div"
    );

  cell.className =
    "symbol " +
    data.className +
    (winner
      ? " win"
      : "");

  const art =
    document.createElement(
      "div"
    );

  art.className =
    "art";

  const icon =
    document.createElement(
      "div"
    );

  icon.className =
    "icon";

  icon.textContent =
    data.icon;

  const label =
    document.createElement(
      "div"
    );

  label.className =
    "symbol-name";

  label.textContent =
    data.name;

  art.appendChild(icon);

  art.appendChild(label);

  cell.appendChild(art);

  return cell;

}


/* ===========================================
   DRAW BOARD
=========================================== */

function drawBoard(
  winningPositions = []
){

  const reels =
    $("reels");

  reels.innerHTML =
    "";

  for(
    let column = 0;
    column < 5;
    column++
  ){

    const reel =
      document.createElement(
        "div"
      );

    reel.className =
      "reel";

    const strip =
      document.createElement(
        "div"
      );

    strip.className =
      "strip";

    for(
      let row = 0;
      row < 3;
      row++
    ){

      const index =
        position(
          column,
          row
        );

      strip.appendChild(

        createSymbol(
          board[index],
          winningPositions.includes(
            index
          )
        )

      );

    }

    reel.appendChild(
      strip
    );

    reels.appendChild(
      reel
    );

  }

}


/* ===========================================
   UPDATE HUD
=========================================== */

function updateUI(){

  $("credit").textContent =
    credit.toFixed(2);

  $("bet").textContent =
    BETS[
      betIndex
    ].toFixed(2);

  $("free").textContent =
    freeSpins;

  $("multiplier").textContent =
    "×" + multiplier;

  $("turbo").textContent =
    turbo
    ? "⚡ TURBO ON"
    : "⚡ TURBO OFF";

  document
    .querySelectorAll(
      "[data-bet]"
    )
    .forEach(
      (button,index) => {

        button
          .classList
          .toggle(
            "active",
            index === betIndex
          );

      }
    );

}


/* ===========================================
   REEL ANIMATION
=========================================== */

async function animateReels(){

  const reels =
    $("reels");

  reels.innerHTML =
    "";

  const symbolHeight =
    window.innerWidth <= 620
    ? 80
    : 100;

  const fakeSymbols = 10;

  const strips = [];

  for(
    let column = 0;
    column < 5;
    column++
  ){

    const reel =
      document.createElement(
        "div"
      );

    reel.className =
      "reel";

    const strip =
      document.createElement(
        "div"
      );

    strip.className =
      "strip";

    for(
      let i = 0;
      i < fakeSymbols;
      i++
    ){

      strip.appendChild(

        createSymbol(
          randomSymbol()
        )

      );

    }

    for(
      let row = 0;
      row < 3;
      row++
    ){

      strip.appendChild(

        createSymbol(
          getCell(
            column,
            row
          )
        )

      );

    }

    reel.appendChild(
      strip
    );

    reels.appendChild(
      reel
    );

    strips.push(
      strip
    );

  }


  await wait(20);


  const baseDuration =
    turbo
    ? 230
    : 650;

  const delay =
    turbo
    ? 35
    : 90;

  const destination =
    -(fakeSymbols *
      symbolHeight);


  strips.forEach(
    (strip,index) => {

      strip.style.transition =
        "transform " +
        (
          baseDuration +
          index * delay
        ) +
        "ms cubic-bezier(.08,.72,.14,1.02)";

      strip.style.transform =
        "translateY(" +
        destination +
        "px)";

    }
  );


  await wait(
    baseDuration +
    delay * 4 +
    80
  );


  drawBoard();

}


/* ===========================================
   CHECK PAYLINES
=========================================== */

function evaluatePaylines(){

  const wins = [];


  for(
    let lineIndex = 0;
    lineIndex <
      PAYLINES.length;
    lineIndex++
  ){

    const line =
      PAYLINES[
        lineIndex
      ];

    const sequence =
      line.map(
        (row,column) =>
          getCell(
            column,
            row
          )
      );


    let baseSymbol =
      null;

    let count = 0;


    for(
      let column = 0;
      column < 5;
      column++
    ){

      const symbol =
        sequence[
          column
        ];


      if(
        symbol === "scatter" ||
        symbol === "bonus"
      ){

        break;

      }


      if(
        baseSymbol === null
      ){

        if(
          symbol === "wild"
        ){

          count++;

          continue;

        }

        baseSymbol =
          symbol;

        count++;

        continue;

      }


      if(
        symbol === baseSymbol ||
        symbol === "wild"
      ){

        count++;

      }

      else{

        break;

      }

    }


    if(
      baseSymbol === null &&
      count >= 3
    ){

      baseSymbol =
        "wild";

    }


    if(
      count >= 3 &&
      PAYTABLE[
        baseSymbol
      ]
    ){

      const indexes = [];

      for(
        let column = 0;
        column < count;
        column++
      ){

        indexes.push(

          position(
            column,
            line[column]
          )

        );

      }


      wins.push({

        line:
          lineIndex,

        symbol:
          baseSymbol,

        count:
          count,

        positions:
          indexes,

        multiplier:
          PAYTABLE[
            baseSymbol
          ][count]

      });

    }

  }


  return wins;

}


/* ===========================================
   TUMBLE
=========================================== */

async function runTumbles(
  currentBet
){

  let totalWin = 0;

  let tumbleNumber = 0;


  while(
    tumbleNumber < 7
  ){

    const wins =
      evaluatePaylines();


    if(
      wins.length === 0
    ){

      break;

    }


    tumbleNumber++;


    const positions =
      [
        ...new Set(
          wins.flatMap(
            win =>
              win.positions
          )
        )
      ];


    const tumbleWin =
      wins.reduce(
        (sum,win) =>

          sum +
          currentBet *
          win.multiplier *
          multiplier,

        0
      );


    totalWin +=
      tumbleWin;


    drawBoard(
      positions
    );


    $("status").textContent =

      "🔥 TUMBLE " +
      tumbleNumber +
      " • " +
      wins.length +
      " VÝHERNÝCH LÍNIÍ" +
      " • ×" +
      multiplier +
      " • +" +
      tumbleWin.toFixed(2);


    await wait(
      turbo
      ? 170
      : 520
    );


    /*
    Remove winning symbols
    and replace them.
    */

    for(
      const index of positions
    ){

      board[index] =
        randomSymbol();

    }


    multiplier =
      Math.min(
        10,
        multiplier + 1
      );


    updateUI();

    drawBoard();


    await wait(
      turbo
      ? 100
      : 230
    );

  }


  return totalWin;

}


/* ===========================================
   COUNT SYMBOL
=========================================== */

function countSymbol(
  symbol
){

  return board
    .filter(
      item =>
        item === symbol
    )
    .length;

}


/* ===========================================
   MODAL
=========================================== */

function openModal(
  html
){

  $("modal").innerHTML =
    html;

  $("overlay")
    .classList
    .add(
      "show"
    );

}


function closeModal(){

  $("overlay")
    .classList
    .remove(
      "show"
    );

}


/* ===========================================
   BONUS PICK
=========================================== */

async function templeBonus(
  currentBet
){

  return new Promise(
    resolve => {

      openModal(`

        <h1>
        TEMPLE BONUS
        </h1>

        <p>
        Vyber jednu nádobu pokladu.
        </p>

        <div class="chests">

          <button>
          🏺
          </button>

          <button>
          🏺
          </button>

          <button>
          🏺
          </button>

        </div>

      `);


      document
        .querySelectorAll(
          ".chests button"
        )
        .forEach(
          button => {

            button.onclick =
              () => {

                const possible = [
                  8,
                  12,
                  18,
                  25,
                  40,
                  60
                ];


                const multiplier =
                  possible[
                    Math.floor(
                      Math.random() *
                      possible.length
                    )
                  ];


                const value =
                  currentBet *
                  multiplier;


                button.textContent =
                  "💰";


                setTimeout(
                  () => {

                    closeModal();

                    resolve(
                      value
                    );

                  },
                  420
                );

              };

          }
        );

    }
  );

}


/* ===========================================
   COUNT-UP WIN
=========================================== */

async function animateWin(
  amount
){

  if(
    amount <= 0
  ){

    return;

  }


  const startingCredit =
    credit;


  const duration =
    turbo
    ? 170
    : 650;


  const start =
    performance.now();


  return new Promise(
    resolve => {


      function frame(now){

        const progress =
          Math.min(
            1,
            (
              now -
              start
            ) /
            duration
          );


        const eased =
          1 -
          Math.pow(
            1 - progress,
            3
          );


        const displayed =
          amount *
          eased;


        $("win").textContent =
          displayed
            .toFixed(2);


        $("credit").textContent =
          (
            startingCredit +
            displayed
          )
          .toFixed(2);


        if(
          progress < 1
        ){

          requestAnimationFrame(
            frame
          );

        }

        else{

          credit +=
            amount;


          updateUI();

          resolve();

        }

      }


      requestAnimationFrame(
        frame
      );

    }
  );

}


/* ===========================================
   BIG WIN
=========================================== */

function bigWin(
  text,
  amount
){

  openModal(`

    <h1>
    ${text}
    </h1>

    <div class="big-number">
    ${amount.toFixed(2)}
    </div>

    <p>
    THE CURSE HAS AWAKENED
    </p>

    <button id="bigContinue">
    POKRAČOVAŤ
    </button>

  `);


  setTimeout(
    () => {

      const button =
        $("bigContinue");

      if(button){

        button.onclick =
          closeModal;

      }

    },
    0
  );

}


/* ===========================================
   MAIN SPIN
=========================================== */

async function spin(){

  if(busy){

    return;

  }


  const currentBet =
    BETS[
      betIndex
    ];


  const freeSpin =
    freeSpins > 0;


  if(
    !freeSpin &&
    credit <
      currentBet
  ){

    $("status").textContent =
      "Nemáš dostatok demo kreditov.";

    return;

  }


  busy =
    true;


  $("spin").disabled =
    true;


  $("win").textContent =
    "0.00";


  if(
    freeSpin
  ){

    freeSpins--;

  }

  else{

    credit -=
      currentBet;

    multiplier =
      1;

  }


  updateUI();


  $("status").textContent =
    freeSpin
    ? "🎁 FREE SPIN..."
    : "𓁢 ANUBIS AWAKENS...";


  board =
    generateBoard();


  await animateReels();


  /*
  SCATTER / BONUS are counted
  from the initial board.
  */

  const scatterCount =
    countSymbol(
      "scatter"
    );


  const bonusCount =
    countSymbol(
      "bonus"
    );


  let totalWin =
    await runTumbles(
      currentBet
    );


  /* FREE SPINS */

  if(
    scatterCount >= 3
  ){

    let awarded = 8;


    if(
      scatterCount === 4
    ){

      awarded = 12;

    }


    if(
      scatterCount >= 5
    ){

      awarded = 18;

    }


    freeSpins +=
      awarded;


    multiplier =
      Math.max(
        multiplier,
        2
      );


    updateUI();


    openModal(`

      <h1>
      SCARAB RITUAL
      </h1>

      <div class="big-number">
      ${awarded}
      </div>

      <p>
      FREE SPINS
      </p>

      <button id="freeContinue">
      POKRAČOVAŤ
      </button>

    `);


    setTimeout(
      () => {

        $("freeContinue")
          .onclick =
          closeModal;

      },
      0
    );

  }


  /* TEMPLE BONUS */

  if(
    bonusCount >= 3
  ){

    const bonusWin =
      await templeBonus(
        currentBet
      );


    totalWin +=
      bonusWin;


    $("status").textContent =

      "🏺 TEMPLE BONUS +" +
      bonusWin.toFixed(2);

  }


  /* PAY WIN */

  if(
    totalWin > 0
  ){

    await animateWin(
      totalWin
    );


    $("status").textContent =

      "✨ WIN +" +
      totalWin.toFixed(2);


    if(
      totalWin >=
      currentBet * 50
    ){

      bigWin(
        "EPIC WIN",
        totalWin
      );

    }

    else if(
      totalWin >=
      currentBet * 20
    ){

      bigWin(
        "MEGA WIN",
        totalWin
      );

    }

    else if(
      totalWin >=
      currentBet * 10
    ){

      bigWin(
        "BIG WIN",
        totalWin
      );

    }

  }

  else if(
    scatterCount < 3 &&
    bonusCount < 3
  ){

    $("status").textContent =
      "Chrám mlčí... skús ďalší spin.";

  }


  busy =
    false;


  $("spin").disabled =
    false;


  updateUI();


  /*
  Free spins continue
  automatically.
  */

  if(
    freeSpins > 0
  ){

    setTimeout(
      spin,
      turbo
      ? 190
      : 520
    );

  }

  else if(
    autoRemaining > 0
  ){

    autoRemaining--;


    if(
      autoRemaining > 0
    ){

      setTimeout(
        spin,
        turbo
        ? 180
        : 390
      );

    }

  }

}


/* ===========================================
   BUTTONS
=========================================== */

$("spin").onclick =
  spin;


$("auto").onclick =
  () => {

    if(busy){

      return;

    }

    autoRemaining =
      10;

    spin();

  };


$("stopAuto").onclick =
  () => {

    autoRemaining =
      0;

    $("status").textContent =
      "AUTO zastavené.";

  };


$("turbo").onclick =
  () => {

    turbo =
      !turbo;

    updateUI();

  };


$("minus").onclick =
  () => {

    if(
      busy
    ){

      return;

    }


    if(
      betIndex > 0
    ){

      betIndex--;

      updateUI();

    }

  };


$("plus").onclick =
  () => {

    if(
      busy
    ){

      return;

    }


    if(
      betIndex <
      BETS.length - 1
    ){

      betIndex++;

      updateUI();

    }

  };


$("reset").onclick =
  () => {

    if(busy){

      return;

    }

    credit =
      1000;

    freeSpins =
      0;

    multiplier =
      1;

    autoRemaining =
      0;

    $("win").textContent =
      "0.00";

    $("status").textContent =
      "𓂀 THE TEMPLE AWAITS — GOOD LUCK!";

    updateUI();

  };


document
  .querySelectorAll(
    "[data-bet]"
  )
  .forEach(
    button => {

      button.onclick =
        () => {

          if(busy){

            return;

          }

          betIndex =
            Number(
              button.dataset.bet
            );

          updateUI();

        };

    }
  );


/* ===========================================
   INITIALIZE
=========================================== */

board =
  generateBoard();

drawBoard();

updateUI();

</script>

</html>
