
<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curse of Anubis Deluxe</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:radial-gradient(circle at 50% 0,#12305a,#05080d 45%,#020306);
color:#fff4cf;
font-family:Arial,sans-serif
}

.app{
max-width:1100px;
margin:auto;
padding:8px
}

.title{
text-align:center;
font-family:Georgia,serif
}

.title small{
display:block;
color:#f4c65b;
letter-spacing:.2em
}

.title b{
font-size:clamp(38px,7vw,78px);
background:linear-gradient(#fff3a6,#e6ad35,#875112);
-webkit-background-clip:text;
color:transparent;
filter:drop-shadow(0 4px 0 #4c2b08)
}

.top{
display:grid;
grid-template-columns:180px 1fr 180px;
gap:8px;
align-items:center
}

.panel{
background:linear-gradient(#0b1727,#03080f);
border:2px solid #9b7129;
border-radius:14px;
padding:10px;
text-align:center
}

.panel b{
color:#f5ce65;
font-size:22px
}

.stage{
display:grid;
grid-template-columns:145px 1fr 145px;
gap:8px
}

.side{
display:flex;
flex-direction:column;
gap:8px
}

.side .panel{flex:1}

.reels{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:4px;
background:#02050a;
padding:6px;
border:4px solid #a97a27;
border-radius:14px;
box-shadow:0 0 30px #000
}

.reel{
height:300px;
overflow:hidden;
position:relative;
background:#06101a
}

.strip{
position:absolute;
inset:0 auto auto 0;
width:100%
}

.sym{
height:100px;
display:flex;
align-items:center;
justify-content:center;
border-bottom:1px solid #223650;
background:radial-gradient(circle,#122238,#05080d 72%)
}

.sym svg{
width:88%;
height:88%;
filter:drop-shadow(0 5px 7px #000)
}

.sym.win{
outline:3px solid #ffe68a;
outline-offset:-4px;
animation:p .45s infinite alternate
}

@keyframes p{
to{
transform:scale(1.04);
filter:brightness(1.4)
}
}

.controls{
display:grid;
grid-template-columns:1fr 1fr 90px 90px 1fr;
gap:7px;
margin-top:8px
}

.disp,button{
min-height:58px;
border-radius:11px;
border:2px solid #8f6623;
background:linear-gradient(#10213a,#06101d);
color:#fff2c0;
font-weight:bold
}

.disp{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center
}

.disp small{color:#e4ba54}

.spin{
height:90px;
border-radius:50%;
background:radial-gradient(circle at 40% 35%,#4db4ff,#0b56b1 45%,#06377a 64%,#f2c65c 66%,#795018 75%);
font-size:18px
}

.msg{
margin-top:8px;
padding:10px;
text-align:center;
background:#07111c;
border:1px solid #31527b;
border-radius:10px
}

.features{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:5px;
margin-top:7px
}

.features div{
background:#07111d;
border:1px solid #284163;
border-radius:8px;
padding:6px;
text-align:center;
font-size:10px;
color:#aab9cc
}

.features b{
display:block;
color:#f0c65a
}

.overlay{
position:fixed;
inset:0;
background:#000d;
display:none;
align-items:center;
justify-content:center;
z-index:9
}

.overlay.show{display:flex}

.card{
width:min(460px,94vw);
background:#081421;
border:2px solid #b5842e;
border-radius:16px;
padding:18px;
text-align:center
}

.card h2{
color:#f6d168;
font-family:Georgia,serif
}

@media(max-width:850px){
.stage{grid-template-columns:1fr}
.side{display:none}
.top{grid-template-columns:1fr}
.top .panel{display:none}
}

@media(max-width:620px){
.reel{height:210px}
.sym{height:70px}

.controls{
grid-template-columns:1fr 1fr 76px
}

.spin{
width:76px;
height:76px
}

.controls>.disp:last-child{
display:none
}

.features{
grid-template-columns:repeat(2,1fr)
}
}
</style>
</head>

<body>

<div class="app">

<div class="top">

<div class="panel">
JACKPOT<br>
<b>100,000.00</b>
</div>

<div class="title">
<small>CURSE OF</small>
<b>ANUBIS</b>
</div>

<div class="panel">
FREE SPINS<br>
<b id="free">0</b>
</div>

</div>

<div class="stage">

<div class="side">

<div class="panel">
GRAND<br>
<b>100K</b>
</div>

<div class="panel">
BUY BONUS<br>
<b id="buy">1000</b>
</div>

</div>

<main>

<div class="reels" id="reels"></div>

<div class="controls">

<div class="disp">
<small>BALANCE</small>
<b id="credit">1000</b>
</div>

<div class="disp">
<small>BET</small>
<b id="bet">10</b>
</div>

<button class="spin" id="spin">
SPIN
</button>

<button id="auto">
AUTO
</button>

<div class="disp">
<small>WIN</small>
<b id="win">0</b>
</div>

</div>

<div class="msg" id="msg">
𓂀 UNLEASH THE CURSE — stlač SPIN
</div>

<div class="features">

<div>
<b>ANUBIS WILD</b>
nahrádza symboly
</div>

<div>
<b>SCARAB</b>
3+ Free Spins
</div>

<div>
<b>BONUS</b>
3+ Bonus Pick
</div>

<div>
<b>TUMBLE</b>
výhry miznú
</div>

<div>
<b>MULTI</b>
až ×10
</div>

</div>

</main>

<div class="side">

<div class="panel">
MULTIPLIER<br>
<b id="multi">×1</b>
</div>

<div class="panel">
DEMO<br>
<small>fiktívne kredity</small>
</div>

</div>

</div>
</div>

<div class="overlay" id="ov">
<div class="card" id="card"></div>
</div>

<script>

const bets=[5,10,20,50,100];

const T=[
["eye",24],
["cobra",22],
["ankh",18],
["pyr",14],
["pharaoh",10],
["anubis",6],
["wild",3],
["scatter",2],
["bonus",1]
];

let credit=1000;
let bi=1;
let free=0;
let multi=1;
let busy=false;
let auto=0;
let board=[];

const $=x=>document.getElementById(x);

const sleep=m=>
new Promise(r=>setTimeout(r,m));

function pick(){

let n=T.reduce((a,x)=>a+x[1],0);

let r=Math.random()*n;

for(const x of T){

r-=x[1];

if(r<=0)return x[0];

}

return "eye";

}

function nb(){

return Array.from(
{length:15},
pick
);

}

function svg(t){

const d=`
<defs>

<linearGradient id="g">
<stop stop-color="#fff0a5"/>
<stop offset=".5" stop-color="#e2a934"/>
<stop offset="1" stop-color="#75430f"/>
</linearGradient>

<linearGradient id="b">
<stop stop-color="#54baff"/>
<stop offset="1" stop-color="#083a82"/>
</linearGradient>

</defs>
`;

if(t==="eye")

return `
<svg viewBox="0 0 100 100">

${d}

<path
d="M10 52Q50 18 90 52Q50 82 10 52Z"
fill="none"
stroke="url(#g)"
stroke-width="7"
/>

<circle
cx="50"
cy="52"
r="15"
fill="url(#b)"
stroke="#f5cf65"
stroke-width="4"
/>

</svg>
`;

if(t==="cobra")

return `
<svg viewBox="0 0 100 100">

${d}

<path
d="M58 87c22-18 16-39 1-44-7-3-7-14 0-20 10-8 21-2 23 7-10-5-17 2-17 9 15 7 19 25 9 38-9 11-27 15-43 8"
fill="none"
stroke="url(#g)"
stroke-width="8"
/>

<circle
cx="72"
cy="27"
r="3"
fill="#f44"
/>

</svg>
`;

if(t==="ankh")

return `
<svg viewBox="0 0 100 100">

${d}

<ellipse
cx="50"
cy="28"
rx="17"
ry="21"
fill="none"
stroke="url(#g)"
stroke-width="8"
/>

<path
d="M50 49v42M24 63h52"
stroke="url(#g)"
stroke-width="9"
/>

</svg>
`;

if(t==="pyr")

return `
<svg viewBox="0 0 100 100">

${d}

<circle
cx="78"
cy="20"
r="10"
fill="#ff8a2e"
/>

<path
d="M12 84L50 18l38 66z"
fill="url(#g)"
stroke="#ffe18b"
stroke-width="3"
/>

<path
d="M50 18v66"
stroke="#6b3c0d"
stroke-width="3"
/>

</svg>
`;

if(t==="pharaoh")

return `
<svg viewBox="0 0 100 100">

${d}

<path
d="M24 22Q50 4 76 22l6 25-12 35H30L18 47z"
fill="url(#g)"
stroke="#ffe18b"
stroke-width="3"
/>

<ellipse
cx="50"
cy="53"
rx="18"
ry="24"
fill="#d69a47"
/>

<path
d="M28 24h44l-7 12H35z"
fill="url(#b)"
/>

</svg>
`;

if(t==="anubis" || t==="wild")

return `
<svg viewBox="0 0 100 100">

${d}

<path
d="M28 26L38 5l8 28M72 26L62 5l-8 28"
fill="#0a1421"
stroke="#e7b94f"
stroke-width="3"
/>

<path
d="M25 34Q50 18 75 34l-8 43-17 13-17-13z"
fill="#111c2b"
stroke="url(#g)"
stroke-width="4"
/>

<circle
cx="41"
cy="49"
r="4"
fill="#4bb9ff"
/>

<circle
cx="59"
cy="49"
r="4"
fill="#4bb9ff"
/>

${
t==="wild"
?
'<text x="50" y="96" text-anchor="middle" fill="#f8d66e" font-size="15" font-weight="bold">WILD</text>'
:
""
}

</svg>
`;

if(t==="scatter")

return `
<svg viewBox="0 0 100 100">

${d}

<ellipse
cx="50"
cy="58"
rx="20"
ry="27"
fill="url(#b)"
stroke="#f2c658"
stroke-width="5"
/>

<circle
cx="50"
cy="25"
r="11"
fill="#ff522e"
stroke="#ffd66b"
stroke-width="4"
/>

<path
d="M30 48L14 35M70 48L86 35M30 65L13 72M70 65L87 72"
stroke="#eec24f"
stroke-width="6"
/>

</svg>
`;

return `
<svg viewBox="0 0 100 100">

${d}

<path
d="M18 79V42l13-18h38l13 18v37z"
fill="#160f09"
stroke="url(#g)"
stroke-width="5"
/>

<circle
cx="50"
cy="38"
r="9"
fill="#ff8b2c"
/>

<text
x="50"
y="94"
text-anchor="middle"
fill="#f6d169"
font-size="14"
font-weight="bold">
BONUS
</text>

</svg>
`;

}

function upd(){

$("credit").textContent=
Math.floor(credit);

$("bet").textContent=
bets[bi];

$("free").textContent=
free;

$("multi").textContent=
"×"+multi;

$("buy").textContent=
bets[bi]*100;

}

function draw(hi=[]){

$("reels").innerHTML="";

for(let c=0;c<5;c++){

let r=document.createElement("div");

r.className="reel";

let s=document.createElement("div");

s.className="strip";

for(let y=0;y<3;y++){

let i=y*5+c;

let d=document.createElement("div");

d.className=
"sym"+(hi.includes(i)?" win":"");

d.innerHTML=
svg(board[i]);

s.appendChild(d);

}

r.appendChild(s);

$("reels").appendChild(r);

}

}

function evalw(){

let m={};
let w=[];

board.forEach((s,i)=>{

if(s==="wild")

w.push(i);

else if(
!["scatter","bonus"].includes(s)
){

if(!m[s])m[s]=[];

m[s].push(i);

}

});

let p={
eye:2,
cobra:2,
ankh:3,
pyr:4,
pharaoh:6,
anubis:8
};

let a=[];

for(const k in m){

let ids=[
...m[k],
...w
];

if(ids.length>=8)

a.push({
ids,
pay:p[k]||2
});

}

return a;

}

async function tumble(b){

let tot=0;
let round=0;

while(round<5){

let w=evalw();

if(!w.length)break;

round++;

let ids=[];
let amt=0;

w.forEach(x=>{

amt+=
b*x.pay*multi;

x.ids.forEach(i=>{

if(!ids.includes(i))

ids.push(i);

});

});

amt=Math.floor(amt);

tot+=amt;

draw(ids);

$("msg").textContent=
`🔥 TUMBLE ${round} • ×${multi} • +${amt}`;

await sleep(450);

ids.forEach(i=>
board[i]=null
);

board=
board.map(x=>
x===null?pick():x
);

multi=
Math.min(10,multi+1);

upd();
draw();

await sleep(220);

}

return tot;

}

function count(x){

return board.filter(
v=>v===x
).length;

}

function show(h){

$("card").innerHTML=h;

$("ov").classList.add("show");

}

async function spin(){

if(busy)return;

let b=bets[bi];

let fs=free>0;

if(!fs && credit<b){

$("msg").textContent=
"Nemáš dosť kreditov.";

return;

}

busy=true;

if(fs){

free--;

}else{

credit-=b;
multi=1;

}

upd();

$("win").textContent=0;

$("msg").textContent=
fs
?
"🎁 FREE SPIN…"
:
"𓂀 Valce sa točia…";

board=nb();

for(let i=0;i<6;i++){

draw();

board=nb();

await sleep(75);

}

draw();

let sc=count("scatter");
let bo=count("bonus");

let tot=
await tumble(b);

if(sc>=3){

let a=
sc>=5
?
15
:
sc===4
?
10
:
8;

free+=a;

multi=
Math.max(2,multi);

upd();

show(`
<h2>${a} FREE SPINS</h2>

<button onclick="
document
.getElementById('ov')
.classList.remove('show')
">
POKRAČOVAŤ
</button>
`);

}

if(bo>=3){

let v=
[10,15,20,30,50]
[
Math.floor(
Math.random()*5
)
]
*b;

tot+=v;

show(`
<h2>BONUS TEMPLE</h2>

<p>
Výhra ${v} kreditov
</p>

<button onclick="
document
.getElementById('ov')
.classList.remove('show')
">
POKRAČOVAŤ
</button>
`);

}

if(tot>0){

credit+=tot;

$("win").textContent=
tot;

$("msg").textContent=
`WIN +${tot}`;

}else if(
sc<3 &&
bo<3
){

$("msg").textContent=
"Bez výhry.";

}

upd();

busy=false;

if(free>0)

setTimeout(
spin,
600
);

else if(auto>0){

auto--;

if(auto>0)

setTimeout(
spin,
400
);

}

}

$("spin").onclick=
spin;

$("auto").onclick=()=>{

if(!busy){

auto=10;
spin();

}

};

board=nb();

draw();

upd();

</script>

</body>
</html>
